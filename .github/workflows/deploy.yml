name: CI/CD - Deploy to VPS

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build & Test Backend (Spring Boot)
  # ─────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (skip tests for speed)
        run: mvn package -DskipTests -B

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 2: Build Frontend (Next.js)
  # ─────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api

  # ─────────────────────────────────────────────
  # JOB 3: Deploy to VPS (chỉ chạy khi push lên main/master)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: VPS deployment
    needs: [ build-backend, build-frontend ]
    # Chỉ deploy khi push lên main/master, không deploy khi là PR
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "=== [1/5] Vào thư mục dự án ==="
            cd /opt/school-records/Minh_project_01

            echo "=== [2/5] Pull code mới nhất ==="
            git pull origin ${{ github.ref_name }}

            echo "=== [3/5] Stop containers cũ ==="
            docker compose -f docker-compose.prod.yml down --remove-orphans

            echo "=== [4/5] Build & Start containers mới ==="
            docker compose -f docker-compose.prod.yml up -d --build

            echo "=== [5/5] Dọn dẹp Docker images cũ ==="
            docker image prune -f

            echo "✅ Deploy thành công!"
            docker compose -f docker-compose.prod.yml ps
